<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | FluxEdu</title><link rel="stylesheet" href="style.css"></head><body class="auth-body"><a class="back" href="index.html">← Página inicial</a><main class="auth"><section class="auth-side"><a class="brand brand-light" href="index.html"><img src="assets/logo-fluxedu.png" alt=""><span>Flux<span>Edu</span><small>Gestão escolar</small></span></a><h1>Gestão escolar,<br>sem complicações.</h1><p>Aceda aos registos da sua instituição a partir de qualquer dispositivo.</p><img src="assets/moldura-fluxedu.png" alt="" class="auth-logo"></section><section class="auth-main"><form id="login-form" class="form-card"><span class="eyebrow">BEM-VINDO DE VOLTA</span><h2>Entrar na plataforma</h2><p class="muted">Use o e-mail e a palavra-passe da sua conta.</p><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="nome@escola.co.mz"><label for="password">Palavra-passe</label><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Mínimo de 8 caracteres"><button class="btn full" type="submit">Entrar →</button><p id="message" class="message" role="status"></p><button class="link-button" id="reset-password" type="button">Esqueci-me da palavra-passe</button><p class="switch">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></body></html>
